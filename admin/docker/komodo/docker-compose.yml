################################
# 🦎 KOMODO - HOMELAB SETUP 🦎 #
################################
## Komodo is a tool to build and deploy software across many servers.
## Docs: https://komo.do/docs

services:
  mongo:
    image: mongo
    container_name: komodo-mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/nas/DockerServices}/komodo/mongo/data:/data/db
      - ${DOCKER_VOLUME_STORAGE:-/mnt/nas/DockerServices}/komodo/mongo/config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
    networks:
      - admin

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    container_name: komodo-core
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - 9120:9120
    env_file: ./.env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    volumes:
      ## Store dated backups of the database
      - ${DOCKER_VOLUME_STORAGE:-/mnt/nas/DockerServices}/komodo/backups:/backups
      ## Store sync files on server (optional)
      - ${DOCKER_VOLUME_STORAGE:-/mnt/nas/DockerServices}/komodo/syncs:/syncs
    extra_hosts:
      ## Allows connection to systemd Periphery on the host at "https://host.docker.internal:8120"
      - host.docker.internal:host-gateway
    networks:
      - admin

  ## Local Periphery - manages Docker on this host
  ## For remote servers, install Periphery separately (see README.md)
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    container_name: komodo-periphery
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: ./.env
    volumes:
      ## Mount external docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Periphery agent root directory (must match inside/outside container)
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
    networks:
      - admin

networks:
  admin:
    external: true

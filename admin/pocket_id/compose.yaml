version: '3.8'

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    env_file: .env
    ports:
      - "1411:1411"
    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/nas/DockerServices}/pocket-id/data:/app/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      # HTTP router (redirect to HTTPS)
      - "traefik.http.routers.pocket-id.entrypoints=web"
      - "traefik.http.routers.pocket-id.rule=Host(`${POCKET_ID_DOMAIN:-pocket-id.slavik.tech}`)"
      
      # HTTPS router
      - "traefik.http.routers.pocket-id-secure.entrypoints=websecure"
      - "traefik.http.routers.pocket-id-secure.rule=Host(`${POCKET_ID_DOMAIN:-pocket-id.slavik.tech}`)"
      - "traefik.http.routers.pocket-id-secure.tls=true"
      - "traefik.http.routers.pocket-id-secure.tls.certresolver=le-cloudflare"
      - "traefik.http.routers.pocket-id-secure.service=pocket-id-secure"
      
      # Service configuration
      - "traefik.http.services.pocket-id-secure.loadbalancer.server.port=1411"
      
      # Watchtower auto-update
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=admin"

networks:
  proxy:
    external: true
